<!-- ===================================================================
     LAHJAKORTTI — OHJAUSSIVU

     Lahjakortit myydään Operoxin kautta, joten sivustolla ei ole omaa
     ostolomaketta. Valikon Lahjakortti-linkki vie suoraan Operoxiin;
     tämä sivu jää paikoilleen, jottei vanhat linkit ja hakutulokset
     johda virhesivulle.
     =================================================================== -->
<section class="osio" id="sisalto" style="min-height:62vh;display:grid;place-content:center">
  <div class="kuori keskita">
    <p class="etiketti etiketti--keskellä">Lahjakortti</p>
    <h1 class="otsikko-m" style="margin-top:.6rem">Lahjakortit ostetaan Operoxista</h1>
    <p class="leipa" style="margin-top:1rem;max-width:54ch;margin-inline:auto">
      Bistro Liekin lahjakortin voi ostaa varausjärjestelmämme kautta.
      Siirrämme sinut sinne hetkessä.</p>
    <div class="napit" style="margin-top:2rem;justify-content:center">
      <a class="nappi" data-linkki="lahjakortti" data-tyhjana="Soita ja kysy"
         data-vara-href="puhelin" href="#"><span>Osta lahjakortti</span></a>
      <a class="nappi nappi--ääriviiva" data-href="puhelin" href="#">
        {{ikoni:soita}}<span>Soita meille</span></a>
    </div>
  </div>
</section>

<script>
  /* Ohjaus Operoxiin. Odotetaan hetki, jotta kävijä ehtii nähdä mihin
     ollaan menossa, ja käytetään replace() jottei paluunappi jää jumiin.

     Ohjaus tehdään VAIN kun ollaan oikeasti tällä sivulla. Yhden tiedoston
     esikatselussa kaikkien sivujen skriptit ajetaan samaan aikaan, ja ilman
     tätä tarkistusta koko esikatselu hyppäisi Operoxiin. */
  (function () {
    if (location.pathname.indexOf('/lahjakortti') === -1) return;
    setTimeout(function () {
      var n = document.querySelector('.nappi[data-linkki="lahjakortti"]');
      var url = n && n.getAttribute('href');
      if (url && url.indexOf('http') === 0) location.replace(url);
    }, 1400);
  })();
</script>
