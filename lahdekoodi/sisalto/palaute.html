<!-- ===================================================================
     PALAUTE — OHJAUSSIVU

     Palautelomake on siirretty Yhteys-sivulle. Tämä sivu jää paikoilleen,
     jotta vanhat linkit ja hakukoneiden tulokset eivät johda virhesivulle.
     Ohjaus tapahtuu heti; jos selain estää sen, kävijä näkee linkin.
     =================================================================== -->
<section class="osio" id="sisalto" style="min-height:60vh;display:grid;place-content:center">
  <div class="kuori keskita">
    <p class="etiketti etiketti--keskellä">Palaute</p>
    <h1 class="otsikko-m" style="margin-top:.6rem">Palaute löytyy nyt Yhteys-sivulta</h1>
    <p class="leipa" style="margin-top:1rem;max-width:52ch;margin-inline:auto">
      Kokosimme palautteen, tarjouspyynnöt ja yhteystiedot samalle sivulle.
      Siirrämme sinut sinne hetkessä.</p>
    <div class="napit" style="margin-top:2rem;justify-content:center">
      <a class="nappi" href="{{linkki:yhteystiedot}}#lomake"><span>Anna palautetta</span></a>
      <a class="nappi nappi--ääriviiva" data-href="puhelin" href="#">
        {{ikoni:soita}}<span>Soita meille</span></a>
    </div>
  </div>
</section>

<script>
  /* Ohjaus Yhteys-sivulle. replace() jottei paluunappi jää jumiin tälle sivulle. */
  (function () {
    /* Vain oikealla /palaute/-sivulla — ei yhden tiedoston esikatselussa,
       jossa kaikkien sivujen skriptit ajetaan yhtä aikaa. */
    if (location.pathname.indexOf('/palaute') === -1) return;
    var kohde = document.querySelector('.nappi[href*="yhteystiedot"]');
    if (kohde) setTimeout(function () { location.replace(kohde.href); }, 900);
  })();
</script>
